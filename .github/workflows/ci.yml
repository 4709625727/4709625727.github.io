name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Content integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # build.js validates the content (layer references, evidence claims,
      # experience totals) and then verifies the committed HTML matches data/.
      - name: Verify content and committed HTML
        run: npm run check

  links:
    name: Internal links and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every referenced local asset exists
        run: |
          fail=0
          for f in $(grep -ohE '(href|src)="[^"#:]+"' index.html 404.html \
                     | sed -E 's/.*="([^"]+)"/\1/' | sed 's#^/##' | sort -u); do
            if [ ! -e "$f" ]; then echo "missing: $f"; fail=1; fi
          done
          exit $fail

      - name: Every in-page anchor resolves
        run: |
          fail=0
          for a in $(grep -ohE 'href="#[a-zA-Z0-9_-]+"' index.html \
                     | sed -E 's/href="#(.*)"/\1/' | sort -u); do
            if ! grep -q "id=\"$a\"" index.html; then echo "dangling anchor: #$a"; fail=1; fi
          done
          exit $fail
